name: Backtesting
# Descarga el histórico, busca los mejores parámetros con walk-forward y
# publica el informe en el resumen de la ejecución y como artefacto.
on:
  workflow_dispatch:
    inputs:
      dias:
        description: "Días de histórico"
        default: "3000"
  pull_request:
    paths:
      - "bot/**"
      - "config.yaml"
      - ".github/workflows/backtest.yml"
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Histórico
        run: python -m bot descargar --dias "${{ inputs.dias || '3000' }}"
      - name: Optimización walk-forward
        run: python -m bot optimizar --salida resultados/informe.md
      - name: Publicar informe
        run: cat resultados/informe.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: informe-backtesting
          path: |
            resultados/informe.md
            estrategia.json
