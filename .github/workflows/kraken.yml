name: Comprobar Kraken
# Solo se lanza a mano (Actions → Comprobar Kraken → Run workflow).
# Comprueba las claves de Kraken y hace un ENSAYO: calcula las órdenes del día
# sobre los saldos reales y Kraken las revisa SIN EJECUTARLAS.
# Este workflow nunca opera con dinero real: no define BOT_DINERO_REAL.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kraken:
    runs-on: ubuntu-latest
    env:
      KRAKEN_API_KEY: ${{ secrets.KRAKEN_API_KEY }}
      KRAKEN_API_SECRET: ${{ secrets.KRAKEN_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Comprobar claves y saldos
        run: |
          python -m bot kraken | tee /tmp/kraken.txt
          { echo '```'; cat /tmp/kraken.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          ! grep -q PELIGRO /tmp/kraken.txt
      - name: Ensayo de las órdenes de hoy (no se ejecuta nada)
        run: python -m bot real --carpeta /tmp/real-ensayo | tee -a "$GITHUB_STEP_SUMMARY"
