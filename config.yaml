# Configuración del bot. Solo se permiten BTC, ETH y LTC.
modo: paper              # paper (simulado) o real
exchange: kraken         # exchange donde opera el bot
fuente_historica: bitstamp  # Kraken solo da ~720 velas; Bitstamp tiene años de histórico en EUR
pares:
  - BTC/EUR
  - ETH/EUR
  - LTC/EUR
timeframe: 4h             # velas que se descargan; la estrategia trabaja con el cierre diario
capital_inicial: 1000    # EUR (simulados en modo paper)

riesgo:
  perdida_maxima_mensual: 0.06 # si el mes pierde un 6%, el bot vende todo y espera al mes siguiente
